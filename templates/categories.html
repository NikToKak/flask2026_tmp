{% extends "base.html" %}

{% block content %}
<h2>Управление категориями</h2>
<p><a href="{{ url_for('category_create') }}">➕ Создать новую категорию</a></p>

{% if categories %}
    <table>
        <thead>
            <tr>
                <th>Название категории</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td>{{ cat.name }}</td>
                <td>
                    <form method="POST" action="{{ url_for('category_delete', id=cat.id) }}" style="display:inline;">
                        <button type="submit" onclick="return confirm('Удалить категорию «{{ cat.name }}»? Посты останутся без категории.')">Удалить</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>Категорий пока нет. Создайте первую категорию.</p>
{% endif %}
{% endblock %}
